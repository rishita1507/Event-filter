
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TasteTrail - Indian Food</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

    <div class="container mt-4">
        <h2 class="text-center">TasteTrail - Indian Food</h2>
        <p class="text-center">Explore Delicious Indian Foods</p>
        <select id="region"  class="form-control mb-5">
            <option value="all">Region</option>
            <option value="northIndian">north Indian</option>
            <option value="southIndian">South Indian</option>
            <option value="eastIndian">East Indian</option>
            <option value="westIndian">West Indian</option>
        </select>
        <div class="row">
            <div class="col-md-3 mb-4 food all northIndian ">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT9sfAsIZNMs4MQpsCiYVCCdXmaAKb85eVDSUUtb8xoiHX6FTt695IQ89Zf&s=10">
                <h3>Thali</h3>
                <span class="badge bg-success">veg</span>
            </div>
            <div class="col-md-3 mb-4 food all northIndian">
                <h3>butter chicken</h3>
                <img src="https://cdn.shopify.com/s/files/1/0565/2568/4873/files/Butter_Chicken_Delhi_480x480.jpg?v=1769152789">
                <span class="badge bg-danger">non-veg</span>
            </div>
            <div class="col-md-3 mb-4 food all westIndian">
                <h3>Vada pav</h3>
                <img src="https://www.oetker.in/assets/recipes/assets/b88600d804b8405c91ad96d078549828/1272x764/vada-pav.webp">
                <span class="badge bg-success">veg</span>
            </div> 
            <div class="col-md-3 mb-4 food all eastIndian">
                <h3>Rasgulla</h3>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQBcAQRSnj4Dcg9zf15wLyA3kGcpTunK9Rh073rZZLLRRB7AtHyIgcK3GSl&s=10">
                <span class="badge bg-success">veg</span>
            </div> 
            <div class="col-md-3 mb-4 food all westIndian">
                <h3>Bombil fry</h3>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQg6SQjV5KgQBu7WY9AA2ZYCbD71SNp8VuHaebSviPYfXMw41h0dcfaBxY&s=10">
                <span class="badge bg-danger">non-veg</span>
            </div> 
            <div class="col-md-3 mb-4 food all southIndian ">
                <img src="https://www.cookwithmanali.com/wp-content/uploads/2020/05/Masala-Dosa-500x500.jpg">
                <h3>Dosa</h3>
                <span class="badge bg-success">veg</span>
            </div>
             <div class="col-md-3 mb-4 food all eastIndian">
                <h3>Fish fry</h3>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRBvook-LhdH4XpOj1HFWpIyka5QuChMA1Y3gdzJ2lWNnV8KK01xPH0bJE&s=10">
                <span class="badge bg-danger">non-veg</span>
            </div> 
            <div class="col-md-3 mb-4 food all southIndian ">
                <img src="https://www.cubesnjuliennes.com/wp-content/uploads/2020/01/Chicken-Biryani.jpg">
                <h3>Chicken Biryani</h3>
                <span class="badge bg-danger">non-veg</span>
            </div>
            
           
            
        </div>
    </div>


    <script src="./assets/js/app.js"></script>

</body>
</html>
